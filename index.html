        // ============================================
        // 僧伽罗语变格系统 (Sinhala Declension)
        // ============================================
        //
        // 僧伽罗语有 8 种格 (Cases)，名词根据语法角色添加不同后缀：
        //
        // 1. 主格 (Nominative)     - 无标记           例: ගෙදර (house)
        // 2. 属格 (Genitive)       - -ge / -ගේ       例: ගෙදරගේ (of the house)
        // 3. 受格 (Accusative)     - -va / -ව        例: ගෙදරව (the house, 宾语)
        // 4. 施格 (Agentive)       - -in / -ින්      例: ගෙදරින් (by the house)
        // 5. 具格 (Instrumental)   - -en / -ෙන්      例: ගෙදරෙන් (with the house)
        // 6. 与格 (Dative)         - -ta / -ට        例: ගෙදරට (to the house)
        // 7. 从格 (Ablative)       - -gen+iwanata    例: ගෙදරගෙන්ඉවනට (from the house)
        // 8. 位置格 (Locative)     - 后置词 sitiji    例: ගෙදර සිටියි (at the house)
        //
        // 此外还有：
        // - 复数后缀: -val / -වල (无生命), -un / -ුන් (有生命)
        // - 指小词缀: -ek / -එක්, -a / -අ
        // - 强调/限定后缀: -ma / -ම, -i / -යි
        // ============================================

        // 僧伽罗语格后缀表（按长度降序排列，优先匹配长后缀）
        const SINHALA_CASE_SUFFIXES = [
            // 从格 (Ablative) - 最长，优先匹配
            { suffix: 'ගෙන්ඉවනට', case: '从格', stem: '' },
            { suffix: 'ගෙන්ඉවන',   case: '从格', stem: '' },
            // 属格 + 复数组合
            { suffix: 'ගේවල',     case: '属格+复数', stem: '' },
            { suffix: 'වලින්',    case: '复数+施格', stem: '' },
            { suffix: 'වලෙන්',    case: '复数+具格', stem: '' },
            { suffix: 'වලට',      case: '复数+与格', stem: '' },
            { suffix: 'වල',       case: '复数', stem: '' },
            // 属格 (Genitive)
            { suffix: 'ගේ',        case: '属格', stem: '' },
            { suffix: 'ge',         case: '属格', stem: '' },
            { suffix: 'ගෙ',        case: '属格', stem: '' },
            // 施格 (Agentive)
            { suffix: 'ින්',       case: '施格', stem: '' },
            { suffix: 'in',         case: '施格', stem: '' },
            // 具格 (Instrumental)
            { suffix: 'ෙන්',       case: '具格', stem: '' },
            { suffix: 'en',         case: '具格', stem: '' },
            // 受格 (Accusative)
            { suffix: 'ව ',        case: '受格', stem: '' },
            { suffix: 'ව',         case: '受格', stem: '' },
            { suffix: 'va',         case: '受格', stem: '' },
            { suffix: 'wo',         case: '受格', stem: '' },
            { suffix: 'වා',        case: '受格', stem: '' },
            { suffix: 'wa',         case: '受格', stem: '' },
            // 与格 (Dative)
            { suffix: 'ට',         case: '与格', stem: '' },
            { suffix: 'ta',         case: '与格', stem: '' },
            { suffix: 'tuh',        case: '与格', stem: '' },
            { suffix: 'ටහ',        case: '与格', stem: '' },
            // 复数 (Plural) - 有生命
            { suffix: 'ුන්',       case: '复数(有生命)', stem: '' },
            { suffix: 'uno',        case: '复数(有生命)', stem: '' },
            // 指小词 / 限定词
            { suffix: 'ෙක්',       case: '指小词', stem: '' },
            { suffix: 'ek',         case: '指小词', stem: '' },
            { suffix: 'එක',        case: '指小词', stem: '' },
            // 强调 / 句末助词
            { suffix: 'යි',        case: '强调', stem: '' },
            { suffix: 'ම',         case: '强调', stem: '' },
            { suffix: 'i',          case: '强调', stem: '' },
        ];

        // 僧伽罗语词干提取：从变格形式还原为基础形式（保守策略）
        function sinhalaStem(word) {
            if (!word || word.length < 3) return [word];

            const stems = new Set();
            stems.add(word); // 原词本身也保留

            // 策略1：只剥离已知的格后缀（精确匹配）
            for (const { suffix } of SINHALA_CASE_SUFFIXES) {
                if (word.endsWith(suffix) && word.length > suffix.length + 2) {
                    stems.add(word.slice(0, -suffix.length));
                }
            }

            // 策略2：连续剥离最多2个后缀
            let current = word;
            for (let round = 0; round < 2; round++) {
                let stripped = false;
                for (const { suffix } of SINHALA_CASE_SUFFIXES) {
                    if (current.endsWith(suffix) && current.length > suffix.length + 2) {
                        current = current.slice(0, -suffix.length);
                        if (current.length >= 2) {
                            stems.add(current);
                            stripped = true;
                        }
                    }
                }
                if (!stripped) break;
            }

            // 移除过短的词干（通常是无效的）
            return Array.from(stems).filter(s => s.length >= 2);
        }

        // 从词干生成变格拓展形式（用于反向匹配）
        function sinhalaExpand(stem) {
            if (!stem || stem.length < 2) return [stem];

            const forms = new Set();
            forms.add(stem);

            // 只生成最常用的变格形式
            const commonSuffixes = [
                'ගේ', 'ව', 'ට', 'ෙන්', 'ින්',  // 常用格后缀
                'වල',  // 复数
            ];

            for (const suffix of commonSuffixes) {
                forms.add(stem + suffix);
            }

            return Array.from(forms);
        }

        // 检测文本是否包含僧伽罗语字符
        function isSinhala(text) {
            return /[\u0D80-\u0DFF]/.test(text);
        }

        // 计算字符串相似度 (Levenshtein Distance)
        function calculateSimilarity(str1, str2) {
            const s1 = str1.toLowerCase();
            const s2 = str2.toLowerCase();
            
            // 完全匹配
            if (s1 === s2) return 100;
            
            // 包含匹配
            if (s1.includes(s2) || s2.includes(s1)) return 90;
            
            // Levenshtein Distance
            const len1 = s1.length;
            const len2 = s2.length;
            const matrix = [];
            
            for (let i = 0; i <= len1; i++) {
                matrix[i] = [i];
            }
            for (let j = 0; j <= len2; j++) {
                matrix[0][j] = j;
            }
            
            for (let i = 1; i <= len1; i++) {
                for (let j = 1; j <= len2; j++) {
                    const cost = s1[i - 1] === s2[j - 1] ? 0 : 1;
                    matrix[i][j] = Math.min(
                        matrix[i - 1][j] + 1,
                        matrix[i][j - 1] + 1,
                        matrix[i - 1][j - 1] + cost
                    );
                }
            }
            
            const distance = matrix[len1][len2];
            const maxLen = Math.max(len1, len2);
            return Math.round((1 - distance / maxLen) * 100);
        }

        // 僧伽罗语智能匹配：词干提取 + 变格拓展（严格模式）
        function sinhalaMatchScore(query, dictEntry) {
            // 1. 精确匹配
            if (query === dictEntry) return { score: 100, type: '精确' };

            // 2. 包含匹配（要求查询词至少3个字符）
            if (query.length >= 3 && dictEntry.includes(query)) {
                return { score: 88, type: '包含' };
            }
            if (dictEntry.length >= 3 && query.includes(dictEntry)) {
                return { score: 88, type: '包含' };
            }

            // 3. 词干提取：将查询词还原为基础形式后精确匹配
            const queryStems = sinhalaStem(query);
            for (const stem of queryStems) {
                if (stem === dictEntry) return { score: 95, type: '变格还原' };
            }

            // 4. 变格拓展：将词典条目拓展后精确匹配查询词
            const dictExpanded = sinhalaExpand(dictEntry);
            for (const form of dictExpanded) {
                if (form === query) return { score: 93, type: '变格拓展' };
            }

            // 5. 双向词干精确匹配（不使用相似度，避免误匹配）
            const dictStems = sinhalaStem(dictEntry);
            for (const qs of queryStems) {
                for (const ds of dictStems) {
                    if (qs === ds && qs.length >= 3) {
                        return { score: 90, type: '词干匹配' };
                    }
                }
            }

            // 不再使用相似度回退，避免大量误匹配
            return null;
        }

        // 执行搜索
        async function performSearch(recordHistory = false, historySinhala = '', historyPrefix = '', historyEnglish = '') {
            const rawQuery = document.getElementById('searchInput').value.trim();
            const prefixFilter = document.getElementById('prefixFilter').value;
            const matchMode = document.querySelector('input[name="matchMode"]:checked').value;
            const similarityThreshold = parseInt(document.getElementById('similaritySlider').value);
            const searchBtn = document.getElementById('searchBtn');

            if (!rawQuery) {
                currentResults = [];
                currentTranslatedQuery = null;
                isChineseQuery = false;
                hideTranslationInfo();
                renderResults();
                return;
            }

            // 检测是否为中文查询
            isChineseQuery = isChinese(rawQuery);
            let searchQuery = rawQuery.toLowerCase();

            // 如果是中文，先翻译成英文
            if (isChineseQuery) {
                searchBtn.disabled = true;
                searchBtn.innerHTML = '<span class="spinner"></span>翻译中...';
                showTranslationInfo(`正在将 "${rawQuery}" 翻译成英文...`, true);

                const result = await translateWithMyMemory(rawQuery, 'zh-CN', 'en');
                
                searchBtn.disabled = false;
                searchBtn.innerHTML = `
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                    搜索
                `;

                if (result.success) {
                    currentTranslatedQuery = result.translation.toLowerCase();
                    searchQuery = currentTranslatedQuery;
                    
                    // 如果清洗前后不同，显示对比
                    if (result.original && result.original !== result.translation) {
                        showTranslationInfo(`中文 "${rawQuery}" → 英译 "${result.original}" → 词语 "${result.translation}" (匹配度: ${(result.match * 100).toFixed(1)}%)`);
                    } else {
                        showTranslationInfo(`中文 "${rawQuery}" → 英文 "${result.translation}" (匹配度: ${(result.match * 100).toFixed(1)}%)`);
                    }
                } else {
                    showTranslationInfo(`翻译失败: ${result.error}，将直接搜索中文`);
                    currentTranslatedQuery = null;
                }
            } else {
                currentTranslatedQuery = null;
                hideTranslationInfo();
            }

            // 过滤数据
            const scoredResults = [];
            
            DICTIONARY_DATA.forEach(item => {
                const english = (item.english || item.en || '').toLowerCase();
                const sinhala = item.sinhala || item.si || '';
                const prefix = item.prefix || item.type || '';
                
                // 词性筛选
                if (prefixFilter && prefix !== prefixFilter) return;

                let score = 0;
                let isExact = false;
                let matchType = '';

                // 根据匹配模式计算分数
                switch (matchMode) {
                    case 'exact':
                        if (english === searchQuery) {
                            score = 100;
                            isExact = true;
                            matchType = '精确';
                        }
                        break;
                    
                    case 'startsWith':
                        if (english === searchQuery) {
                            score = 100;
                            isExact = true;
                            matchType = '精确';
                        } else if (english.startsWith(searchQuery)) {
                            score = 90;
                            matchType = '开头';
                        }
                        break;
                    
                    case 'contains':
                        if (english === searchQuery) {
                            score = 100;
                            isExact = true;
                            matchType = '精确';
                        } else if (english.startsWith(searchQuery)) {
                            score = 90;
                            matchType = '开头';
                        } else if (english.includes(searchQuery)) {
                            score = 80;
                            matchType = '包含';
                        }
                        break;
                    
                    case 'fuzzy':
                        const similarity = calculateSimilarity(english, searchQuery);
                        if (similarity >= similarityThreshold) {
                            score = similarity;
                            isExact = similarity === 100;
                            matchType = similarity === 100 ? '精确' : `相似 ${similarity}%`;
                        }
                        break;
                }

                // 僧伽罗语搜索（智能变格匹配）
                if (score === 0 && !isChineseQuery && isSinhala(rawQuery)) {
                    const siMatch = sinhalaMatchScore(rawQuery, sinhala);
                    if (siMatch) {
                        score = siMatch.score;
                        matchType = siMatch.type;
                        isExact = siMatch.score === 100;
                    }
                }

                if (score > 0) {
                    scoredResults.push({
                        item,
                        score,
                        isExact,
                        matchType,
                        english: item.english || item.en || '',
                        sinhala: item.sinhala || item.si || '',
                        prefix: item.prefix || item.type || ''
                    });
                }
            });

            // 排序：精确匹配优先，然后按分数降序
            scoredResults.sort((a, b) => {
                if (a.isExact && !b.isExact) return -1;
                if (!a.isExact && b.isExact) return 1;
                return b.score - a.score;
            });

            // 合并词条（按搜索词类型决定合并基准）
            const isSinhalaQuery = isSinhala(rawQuery);
            const groupedResults = groupResults(scoredResults, isSinhalaQuery, rawQuery);

            currentResults = groupedResults;
            currentPage = 1;
            renderResults();
            
            // 只有从推荐词条点击搜索时才记录搜索历史
            if (recordHistory) {
                addSearchHistory(rawQuery, historySinhala || '', historyPrefix || '', historyEnglish || '');
            }
        }

        // 按搜索词类型合并词条
        function groupResults(scoredResults, isSinhalaQuery, rawQuery) {
            const grouped = new Map();
            
            scoredResults.forEach(result => {
                // 确定分组键：使用搜索方向对应的语言作为键
                // 英文搜索时按英文词干分组，僧伽罗语搜索时按僧伽罗语词干分组
                let groupKey;
                let mainWord;
                if (isSinhalaQuery) {
                    // 僧伽罗语搜索，按僧伽罗语词干分组
                    groupKey = result.sinhala.toLowerCase();
                    mainWord = result.sinhala;
                } else {
                    // 英文搜索，按英文词干分组（去掉词性标记）
                    const englishStem = extractWordStem(result.english);
                    groupKey = englishStem.toLowerCase();
                    mainWord = result.english;
                }
                
                if (!grouped.has(groupKey)) {
                    grouped.set(groupKey, {
                        groupKey,
                        isSinhalaQuery,
                        mainWord,
                        alternatives: [],
                        bestMatch: result,
                        allEnglish: [],
                        allSinhala: [],
                        allPrefixes: new Set(),
                        existingKeys: new Set()  // 用于去重
                    });
                }
                
                const group = grouped.get(groupKey);
                
                // 去重：使用 english+sinhala+prefix 作为唯一键
                const uniqueKey = `${result.english}|${result.sinhala}|${result.prefix}`;
                if (group.existingKeys.has(uniqueKey)) {
                    return;  // 跳过重复项
                }
                group.existingKeys.add(uniqueKey);
                
                group.alternatives.push(result);
                group.allEnglish.push(result.english);
                group.allSinhala.push(result.sinhala);
                group.allPrefixes.add(result.prefix);
                
                // 更新最佳匹配
                if (result.score > group.bestMatch.score || 
                    (result.score === group.bestMatch.score && result.isExact)) {
                    group.bestMatch = result;
                }
            });
            
            // 转换为数组并排序
            return Array.from(grouped.values()).sort((a, b) => {
                if (a.bestMatch.isExact && !b.bestMatch.isExact) return -1;
                if (!a.bestMatch.isExact && b.bestMatch.isExact) return 1;
                return b.bestMatch.score - a.bestMatch.score;
            });
        }

        // 提取单词词干（去掉括号内的词性标记）
        function extractWordStem(word) {
            if (!word) return '';
            // 去掉括号内的内容，如 "doctor (n.)" -> "doctor"
            return word.replace(/\s*\([^)]+\)/g, '').trim();
        }

        // 渲染结果
        function renderResults() {
            const resultsList = document.getElementById('resultsList');
            const resultCount = document.getElementById('resultCount');
            const pagination = document.getElementById('pagination');

            resultCount.textContent = currentResults.length.toLocaleString();

            if (currentResults.length === 0) {
                resultsList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔍</div>
                        <p>未找到匹配的结果</p>
                        ${isChineseQuery ? '<p style="font-size: 0.875rem; margin-top: 0.5rem;">尝试调整匹配模式或相似度阈值</p>' : ''}
                    </div>
                `;
                pagination.innerHTML = '';
                return;
            }

            // 分页
            const totalPages = Math.ceil(currentResults.length / ITEMS_PER_PAGE);
            const start = (currentPage - 1) * ITEMS_PER_PAGE;
            const end = start + ITEMS_PER_PAGE;
            const pageResults = currentResults.slice(start, end);

            // 渲染结果列表
            resultsList.innerHTML = pageResults.map((result, index) => {
                const globalIndex = start + index;
                
                // 判断是否是分组结果
                if (result.alternatives && result.alternatives.length > 1) {
                    return renderGroupResult(result, globalIndex);
                } else {
                    return renderSingleResult(result.bestMatch, globalIndex);
                }
            }).join('');

            // 渲染分页
            renderPagination(totalPages);
        }

        // 渲染分组结果（相册样式）
        function renderGroupResult(group, globalIndex) {
            const { isSinhalaQuery, alternatives, bestMatch, mainWord } = group;
            const count = alternatives.length;
            const mainSinhala = bestMatch.sinhala;
            const isExact = bestMatch.isExact;
            
            // 构建显示内容：根据搜索方向显示不同的格式
            let displayText = '';
            if (isSinhalaQuery) {
                // 僧伽罗语搜索：显示所有英文翻译
                displayText = alternatives.map(item => `${item.english} (${item.prefix})`).join('; ');
            } else {
                // 英文搜索：显示所有僧伽罗语翻译
                displayText = alternatives.map(item => `${item.sinhala} (${item.prefix})`).join('; ');
            }
            
            // 检查整个分组是否已收藏
            const isFavorited = isGroupFavorited(group);
            
            return `
                <div class="result-group" id="group-${globalIndex}">
                    <div class="result-group-header">
                        <div class="result-group-main">
                            <div class="result-group-title">${escapeHtml(mainWord)}</div>
                            <div class="result-group-others">${escapeHtml(displayText)}</div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 0.5rem;">
                            <span class="result-group-count">${count}个词义</span>
                            <button class="favorite-btn ${isFavorited ? 'favorited' : ''}" 
                                    onclick="toggleFavoriteForGroup(${globalIndex}, this)"
                                    title="${isFavorited ? '取消收藏' : '收藏'}">
                                ${isFavorited ? '❤️' : '🤍'}
                            </button>
                        </div>
                    </div>
                    <button class="result-group-expand" onclick="toggleGroupExpand(${globalIndex})">
                        展开查看详情
                    </button>
                    <div class="result-group-items">
                        ${alternatives.map((alt, idx) => {
                            const altIndex = globalIndex * 100 + idx;
                            return `
                                <div class="result-group-item">
                                    <div class="result-group-item-header">
                                        <span class="result-word">${escapeHtml(alt.english)}</span>
                                        <span class="result-prefix">${alt.prefix}</span>
                                    </div>
                                    <div class="result-translation">${escapeHtml(alt.sinhala)}</div>
                                    <div class="result-similarity">
                                        <span class="score ${alt.score >= 90 ? 'high' : (alt.score >= 70 ? 'medium' : 'low')}">${alt.matchType}</span>
                                    </div>
                                    <div class="chinese-translation">
                                        <button class="chinese-translation-btn" onclick="showChineseTranslationForAlt('${escapeHtml(alt.english)}', ${altIndex}, this)">
                                            <span>🇨🇳</span>
                                            <span>查看中文翻译</span>
                                        </button>
                                            <div class="chinese-translation-text" id="chinese-${altIndex}" style="display: none;"></div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    ${count === 1 ? `
                        <div class="chinese-translation">
                            <button class="chinese-translation-btn" onclick="showChineseTranslationForAlt('${escapeHtml(mainWord)}', ${globalIndex * 100}, this)">
                                <span>🇨🇳</span>
                                <span>查看中文翻译</span>
                            </button>
                            <div class="chinese-translation-text" id="chinese-${globalIndex * 100}" style="display: none;"></div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // 渲染单个结果
        function renderSingleResult(result, globalIndex) {
            const { english, sinhala, prefix, score, isExact, matchType } = result;
            
            let scoreClass = 'low';
            if (score >= 90) scoreClass = 'high';
            else if (score >= 70) scoreClass = 'medium';
            
            const isFavorited = isFavoriteForSuggestion(english, sinhala, prefix);
            return `
                <div class="result-item ${isExact ? 'exact-match' : ''}">
                    <div class="result-header">
                        <span class="result-word">${escapeHtml(english)}</span>
                        <div style="display: flex; align-items: center; gap: 0.5rem;">
                            <span class="result-prefix" title="${PREFIX_DESCRIPTIONS[prefix] || prefix}">${prefix}</span>
                            <button class="favorite-btn ${isFavorited ? 'favorited' : ''}" 
                                    onclick="toggleFavoriteForSuggestion('${escapeHtml(english)}', '${escapeHtml(sinhala)}', '${escapeHtml(prefix)}', this)"
                                    title="${isFavorited ? '取消收藏' : '收藏'}">
                                ${isFavorited ? '❤️' : '🤍'}
                            </button>
                        </div>
                    </div>
                    <div class="result-translation">${escapeHtml(sinhala)}</div>
                    <div class="result-similarity">
                        <span class="score ${scoreClass}">${matchType}</span>
                    </div>
                    <div class="chinese-translation">
                        <button class="chinese-translation-btn" onclick="showChineseTranslationForAlt('${escapeHtml(english)}', ${globalIndex * 100}, this)">
                            <span>🇨🇳</span>
                            <span>查看中文翻译</span>
                        </button>
                        <div class="chinese-translation-text" id="chinese-${globalIndex * 100}" style="display: none;"></div>
                    </div>
                </div>
            `;
        }

        // 切换分组展开/收起
        function toggleGroupExpand(globalIndex) {
            const group = document.getElementById(`group-${globalIndex}`);
            if (group) {
                group.classList.toggle('expanded');
                const btn = group.querySelector('.result-group-expand');
                if (btn) {
                    if (group.classList.contains('expanded')) {
                        btn.textContent = '收起';
                    } else {
                        btn.textContent = `查看所有 ${group.querySelectorAll('.result-group-item').length} 个词义`;
                    }
                }
            }
        }

        // 检查分组是否已收藏
        function isGroupFavorited(group) {
            if (!group || !group.alternatives) return false;
            
            const favorites = getFavorites(group.isSinhalaQuery ? 'si-en' : 'en-si');
            
            // 检查是否所有词条都已收藏
            return group.alternatives.every(alt => 
                favorites.some(fav => 
                    fav.english === alt.english && fav.sinhala === alt.sinhala && fav.prefix === alt.prefix
                )
            );
        }

        // 收藏整个分组
        function toggleFavoriteForGroup(globalIndex, btn) {
            const group = currentResults[globalIndex];
            if (!group || !group.alternatives) return;
            
            // 根据搜索方向选择收藏本
            const bookType = group.isSinhalaQuery ? 'si-en' : 'en-si';
            
            // 使用公共的收藏处理函数
            handleFavoriteToggle(group.alternatives, bookType, btn);
            
            updateFavoritesCount();
            
            // 更新分组内各个词条的收藏状态显示
            const groupEl = document.getElementById(`group-${globalIndex}`);
            if (groupEl) {
                const favButtons = groupEl.querySelectorAll('.favorite-btn');
                favButtons.forEach(favBtn => {
                    favBtn.innerHTML = allFavorited ? '🤍' : '❤️';
                    if (allFavorited) {
                        favBtn.classList.remove('favorited');
                    } else {
                        favBtn.classList.add('favorited');
                    }
                });
            }
            
            // 刷新预览界面的收藏状态
            const query = document.getElementById('searchInput').value.trim();
            if (query) {
                const suggestions = getSuggestions(query);
                renderSuggestions(suggestions);
            }
            
            // 刷新搜索记录的收藏状态
            renderSearchHistory();
        }

        // 显示中文翻译（用于分组中的词条）
        async function showChineseTranslationForAlt(english, index, btn) {
            const textDiv = document.getElementById(`chinese-${index}`);
            
            if (textDiv.style.display === 'block') {
                textDiv.style.display = 'none';
                btn.innerHTML = '<span>🇨🇳</span><span>查看中文翻译</span>';
                return;
            }

            btn.innerHTML = '<span class="loading"></span><span>翻译中...</span>';
            btn.disabled = true;

            const translation = await translateWithMyMemory(english, 'en', 'zh-CN');

            btn.disabled = false;
            
            if (translation.success) {
                // 如果清洗前后不同，显示对比
                if (translation.original && translation.original !== translation.translation) {
                    textDiv.textContent = `中文: ${translation.original} → ${translation.translation}`;
                } else {
                    textDiv.textContent = `中文: ${translation.translation}`;
                }
                textDiv.style.display = 'block';
                btn.innerHTML = '<span>🔼</span><span>隐藏中文</span>';
            } else {
                textDiv.textContent = '翻译失败，请重试';
                textDiv.style.display = 'block';
                btn.innerHTML = '<span>🔄</span><span>重试</span>';
            }
        }

        // 显示中文翻译
        async function showChineseTranslation(index, btn) {
            const textDiv = document.getElementById(`chinese-${index}`);
            
            if (textDiv.style.display === 'block') {
                textDiv.style.display = 'none';
                btn.innerHTML = '<span>🇨🇳</span><span>查看中文翻译</span>';
                return;
            }

            const result = currentResults[index];
            const english = result.english;

            btn.innerHTML = '<span class="loading"></span><span>翻译中...</span>';
            btn.disabled = true;

            const translation = await translateWithMyMemory(english, 'en', 'zh-CN');

            btn.disabled = false;
            
            if (translation.success) {
                textDiv.textContent = `中文: ${translation.translation}`;
                textDiv.style.display = 'block';
                btn.innerHTML = '<span>🔼</span><span>隐藏中文</span>';
            } else {
                textDiv.textContent = '翻译失败，请重试';
                textDiv.style.display = 'block';
                btn.innerHTML = '<span>🔄</span><span>重试</span>';
            }
        }

        // 渲染分页
        function renderPagination(totalPages) {
            const pagination = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let html = '';
            
            html += `<button class="page-btn" onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>上一页</button>`;
            
            const maxVisible = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
            let endPage = Math.min(totalPages, startPage + maxVisible - 1);
            
            if (endPage - startPage < maxVisible - 1) {
                startPage = Math.max(1, endPage - maxVisible + 1);
            }

            if (startPage > 1) {
                html += `<button class="page-btn" onclick="goToPage(1)">1</button>`;
                if (startPage > 2) html += `<span style="padding: 0.5rem;">...</span>`;
            }

            for (let i = startPage; i <= endPage; i++) {
                html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) html += `<span style="padding: 0.5rem;">...</span>`;
                html += `<button class="page-btn" onclick="goToPage(${totalPages})">${totalPages}</button>`;
            }

            html += `<button class="page-btn" onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>下一页</button>`;
            
            pagination.innerHTML = html;
        }

        // 跳转到指定页
        function goToPage(page) {
            currentPage = page;
            renderResults();
            document.getElementById('resultsList').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // 选择词性
        function selectPrefix(prefix) {
            document.getElementById('prefixFilter').value = prefix;
            document.querySelectorAll('.legend-item').forEach(item => {
                item.classList.toggle('active', item.textContent === prefix);
            });
            performSearch();
        }

        // 清除搜索
        function clearSearch() {
            document.getElementById('prefixFilter').value = '';
            document.querySelectorAll('.legend-item').forEach(item => item.classList.remove('active'));
            performSearch();
        }

        // 收藏功能 - 支持两个收藏本
        // bookType: 'en-si' (英翻僧) 或 'si-en' (僧翻英)
        function getFavorites(bookType = 'en-si') {
            const stored = localStorage.getItem(`dictionary_favorites_${bookType}`);
            return stored ? JSON.parse(stored) : [];
        }

        function saveFavorites(favorites, bookType = 'en-si') {
            localStorage.setItem(`dictionary_favorites_${bookType}`, JSON.stringify(favorites));
        }

        function isFavorite(english, sinhala, prefix) {
            const favorites = getFavorites();
            return favorites.some(fav => 
                fav.english === english && fav.sinhala === sinhala && fav.prefix === prefix
            );
        }

        function toggleFavorite(index, btn) {
            const result = currentResults[index];
            const favorites = getFavorites();
            const { english, sinhala, prefix } = result;
            
            const existingIndex = favorites.findIndex(fav => 
                fav.english === english && fav.sinhala === sinhala && fav.prefix === prefix
            );
            
            if (existingIndex >= 0) {
                favorites.splice(existingIndex, 1);
                btn.classList.remove('favorited');
                btn.innerHTML = '🤍';
                btn.title = '收藏';
            } else {
                favorites.push({ english, sinhala, prefix, timestamp: Date.now() });
                btn.classList.add('favorited');
                btn.innerHTML = '❤️';
                btn.title = '取消收藏';
            }
            
            saveFavorites(favorites);
        }

        // 搜索历史功能
        function getSearchHistory() {
            const stored = localStorage.getItem('dictionary_search_history');
            return stored ? JSON.parse(stored) : [];
        }

        function saveSearchHistory(history) {
            localStorage.setItem('dictionary_search_history', JSON.stringify(history));
        }

        function addSearchHistory(query, sinhala, prefix, english) {
            if (!query.trim()) return;
            
            const history = getSearchHistory();
            const existingIndex = history.findIndex(item => item.query.toLowerCase() === query.toLowerCase());
            
            if (existingIndex >= 0) {
                history.splice(existingIndex, 1);
            }
            
            history.unshift({ 
                query, 
                sinhala: sinhala || '', 
                english: english || '', 
                prefix: prefix || '', 
                timestamp: Date.now() 
            });
            
            if (history.length > 100) {
                history.pop();
            }
            
            saveSearchHistory(history);
            renderSearchHistory();
        }

        function removeSearchHistory(index) {
            const history = getSearchHistory();
            history.splice(index, 1);
            saveSearchHistory(history);
            renderSearchHistory();
        }

        function clearSearchHistory() {
            localStorage.removeItem('dictionary_search_history');
            renderSearchHistory();
        }

        function toggleFavoriteFromHistory(query, btn) {
            const historyItem = getSearchHistory().find(item => item.query === query);
            if (!historyItem || !historyItem.sinhala || !historyItem.prefix) {
                alert('无法收藏：该搜索记录不包含完整的词条信息');
                return;
            }

            const favorites = getFavorites();
            const existingIndex = favorites.findIndex(fav => 
                fav.english === query && fav.sinhala === historyItem.sinhala && fav.prefix === historyItem.prefix
            );
            
            if (existingIndex >= 0) {
                favorites.splice(existingIndex, 1);
                btn.innerHTML = '🤍';
            } else {
                favorites.push({ 
                    english: query, 
                    sinhala: historyItem.sinhala, 
                    prefix: historyItem.prefix, 
                    timestamp: Date.now() 
                });
                btn.innerHTML = '❤️';
            }
            
            saveFavorites(favorites);
            updateFavoritesCount();
        }

        function isFavoriteQuery(query) {
            const historyItem = getSearchHistory().find(item => item.query === query);
            if (!historyItem || !historyItem.sinhala || !historyItem.prefix) return false;
            
            const favorites = getFavorites();
            return favorites.some(fav => 
                fav.english === query && 
                fav.sinhala === historyItem.sinhala && 
                fav.prefix === historyItem.prefix
            );
        }

        function showSearchHistory() {
            const dropdown = document.getElementById('searchHistoryDropdown');
            dropdown.classList.add('active');
        }

        function hideSearchHistory() {
            const dropdown = document.getElementById('searchHistoryDropdown');
            dropdown.classList.remove('active');
        }

        function renderSearchHistory() {
            const history = getSearchHistory();
            const list = document.getElementById('searchHistoryList');
            const header = document.getElementById('searchHistoryHeader');
            
            if (history.length === 0) {
                header.style.display = 'none';
                list.innerHTML = '<li class="search-history-empty">暂无搜索记录</li>';
                return;
            }
            
            // 按组整理搜索记录
            const groupedHistory = groupHistoryByStem(history);
            
            header.style.display = 'flex';
            list.innerHTML = groupedHistory.map((group, groupIndex) => {
                const { mainWord, items, latestTime } = group;
                const timeStr = formatTime(latestTime);
                
                // 获取完整的词义组合（重新搜索）
                const isSi = isSinhala(mainWord);
                const results = isSi 
                    ? searchBySinhalaSmart(mainWord) 
                    : searchEnglish(mainWord, 'exact');
                
                // 构建显示内容（使用搜索结果）
                let displayTexts = [];
                if (results.length > 0) {
                    if (isSi) {
                        displayTexts = results.map(item => `${item.english} (${item.prefix})`);
                    } else {
                        displayTexts = results.map(item => `${item.sinhala} (${item.prefix})`);
                    }
                } else {
                    // 如果没有找到结果，使用历史记录中的数据
                    if (isSi) {
                        displayTexts = items.map(item => item.english ? `${item.english} (${item.prefix})` : '');
                    } else {
                        displayTexts = items.map(item => item.sinhala ? `${item.sinhala} (${item.prefix})` : '');
                    }
                    // 过滤空字符串
                    displayTexts = displayTexts.filter(t => t);
                }
                
                const fullText = displayTexts.join('; ');
                const truncatedText = truncateText(fullText, 60);
                const isFav = isGroupFavoritedForHistory(items);
                
                return `
                    <li class="search-history-item" onclick="searchFromHistory('${escapeHtml(mainWord)}')">
                        <span class="search-history-text">${escapeHtml(mainWord)}</span>
                        <span class="search-history-translations" title="${escapeHtml(fullText)}">${escapeHtml(truncatedText)}</span>
                        <span class="search-history-time">${timeStr}</span>
                        <div class="search-history-actions">
                            <button class="search-history-action-btn favorite" onclick="event.stopPropagation(); toggleFavoriteFromHistoryGroup('${encodeURIComponent(JSON.stringify(items))}', this)">
                                ${isFav ? '❤️' : '🤍'}
                            </button>
                            <button class="search-history-action-btn delete" onclick="event.stopPropagation(); removeSearchHistoryGroup('${escapeHtml(mainWord)}')">
                                🗑️
                            </button>
                        </div>
                    </li>
                `;
            }).join('');
        }

        // 按词干分组搜索历史
        function groupHistoryByStem(history) {
            const grouped = new Map();
            
            history.forEach(item => {
                const isSi = isSinhala(item.query);
                let groupKey;
                if (isSi) {
                    groupKey = item.query.toLowerCase();
                } else {
                    groupKey = extractWordStem(item.query).toLowerCase();
                }
                
                if (!grouped.has(groupKey)) {
                    grouped.set(groupKey, {
                        mainWord: item.query,
                        isSinhala,
                        items: [],
                        latestTime: item.timestamp
                    });
                }
                
                const group = grouped.get(groupKey);
                group.items.push(item);
                if (item.timestamp > group.latestTime) {
                    group.latestTime = item.timestamp;
                }
            });
            
            return Array.from(grouped.values()).sort((a, b) => b.latestTime - a.latestTime);
        }

        // 检查搜索历史组是否已收藏
        function isGroupFavoritedForHistory(items) {
            if (!items || items.length === 0) return false;
            
            const query = items[0].query;
            const isSi = isSinhala(query);
            const bookType = isSi ? 'si-en' : 'en-si';
            
            // 获取完整的词义组合（重新搜索）
            const results = isSi 
                ? searchBySinhalaSmart(query) 
                : searchEnglish(query, 'exact');
            
            if (results.length === 0) {
                // 如果没有找到结果，使用历史记录中的数据
                const favorites = getFavorites(bookType);
                return items.every(item => 
                    favorites.some(fav => 
                        fav.english === item.english && fav.sinhala === item.sinhala && fav.prefix === item.prefix
                    )
                );
            }
            
            // 使用搜索结果检查收藏状态
            const favorites = getFavorites(bookType);
            return results.every(item => 
                favorites.some(fav => 
                    fav.english === item.english && fav.sinhala === item.sinhala && fav.prefix === item.prefix
                )
            );
        }

        // 收藏/取消收藏搜索历史组
        function toggleFavoriteFromHistoryGroup(itemsJson, btn) {
            const historyItems = JSON.parse(decodeURIComponent(itemsJson));
            if (!historyItems || historyItems.length === 0) return;
            
            const query = historyItems[0].query;
            const isSi = isSinhala(query);
            const bookType = isSi ? 'si-en' : 'en-si';
            
            // 获取完整的词义组合（重新搜索）
            const results = isSi 
                ? searchBySinhalaSmart(query) 
                : searchEnglish(query, 'exact');
            
            if (results.length === 0) {
                // 如果没有找到结果，使用历史记录中的数据
                handleFavoriteToggle(historyItems, bookType, btn);
            } else {
                // 使用搜索结果进行收藏
                handleFavoriteToggle(results, bookType, btn);
            }
            
            // 刷新界面
            updateFavoritesCount();
            renderFavoritesPanel(bookType);
            
            // 刷新预览和搜索记录
            const suggestions = getSuggestions(query);
            renderSuggestions(suggestions);
            renderSearchHistory();
        }
        
        // 处理收藏/取消收藏逻辑
        function handleFavoriteToggle(items, bookType, btn) {
            const favorites = getFavorites(bookType);
            
            const allFavorited = items.every(item => 
                favorites.some(fav => 
                    fav.english === item.english && fav.sinhala === item.sinhala && fav.prefix === item.prefix
                )
            );
            
            if (allFavorited) {
                items.forEach(item => {
                    const idx = favorites.findIndex(fav => 
                        fav.english === item.english && fav.sinhala === item.sinhala && fav.prefix === item.prefix
                    );
                    if (idx >= 0) {
                        favorites.splice(idx, 1);
                    }
                });
                btn.innerHTML = '🤍';
            } else {
                items.forEach(item => {
                    const exists = favorites.some(fav => 
                        fav.english === item.english && fav.sinhala === item.sinhala && fav.prefix === item.prefix
                    );
                    if (!exists) {
                        favorites.push({ 
                            english: item.english, 
                            sinhala: item.sinhala, 
                            prefix: item.prefix, 
                            timestamp: Date.now() 
                        });
                    }
                });
                btn.innerHTML = '❤️';
            }
            
            saveFavorites(favorites, bookType);
        }

        // 删除搜索历史组
        function removeSearchHistoryGroup(mainWord) {
            const history = getSearchHistory();
            const isSi = isSinhala(mainWord);
            let groupKey;
            if (isSi) {
                groupKey = mainWord.toLowerCase();
            } else {
                groupKey = extractWordStem(mainWord).toLowerCase();
            }
            
            const filtered = history.filter(item => {
                const itemKey = isSinhala ? item.query.toLowerCase() : extractWordStem(item.query).toLowerCase();
                return itemKey !== groupKey;
            });
            
            saveSearchHistory(filtered);
            renderSearchHistory();
        }

        function formatTime(timestamp) {
            const now = Date.now();
            const diff = now - timestamp;
            
            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(diff / 3600000);
            const days = Math.floor(diff / 86400000);
            
            if (minutes < 1) return '刚刚';
            if (minutes < 60) return `${minutes}分钟前`;
            if (hours < 24) return `${hours}小时前`;
            if (days < 7) return `${days}天前`;
            
            const date = new Date(timestamp);
            return `${date.getMonth() + 1}/${date.getDate()}`;
        }

        function searchFromHistory(query) {
            document.getElementById('searchInput').value = query;
            hideSearchHistory();
            performSearch();
        }

        // HTML 转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 显示错误
        function showError(message) {
            document.getElementById('resultsList').innerHTML = `
                <div class="empty-state" style="color: var(--accent);">
                    <div class="empty-state-icon">⚠️</div>
                    <p>${message}</p>
                </div>
            `;
        }

        // 启动应用
        init();
    </script>
</body>
</html>
