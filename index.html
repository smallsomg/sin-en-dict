<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>僧伽罗语-英语词典 | Sinhala-English Dictionary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1a1a2e;
            --primary-light: #16213e;
            --accent: #e94560;
            --accent-hover: #ff6b6b;
            --gold: #f4d03f;
            --text: #2c3e50;
            --text-light: #5d6d7e;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --border: #e9ecef;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
            --shadow-hover: 0 8px 30px rgba(0,0,0,0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans Sinhala', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            padding: 3rem 1.5rem 4rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(233,69,96,0.1) 0%, transparent 70%);
            animation: pulse 15s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        .header-content {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 600;
            color: white;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .header .subtitle {
            color: rgba(255,255,255,0.7);
            font-size: 1rem;
            font-weight: 300;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--gold);
        }

        .stat-label {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.6);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .favorites-btns {
            display: flex;
            gap: 0.5rem;
        }

        .favorites-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid transparent;
            border-radius: 12px;
            padding: 0.5rem 0.75rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.35rem;
            color: white;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .favorites-btn:hover {
            background: rgba(255,255,255,0.25);
        }

        .favorites-btn.active {
            background: rgba(255,255,255,0.3);
            border-color: rgba(255,255,255,0.5);
        }

        .favorites-icon {
            font-size: 1.25rem;
        }

        .favorites-count {
            background: rgba(255,255,255,0.3);
            padding: 0.125rem 0.5rem;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .favorites-panel {
            position: fixed;
            top: 0;
            right: -400px;
            width: 400px;
            max-width: 90vw;
            height: 100vh;
            background: var(--card-bg);
            box-shadow: -4px 0 20px rgba(0,0,0,0.2);
            z-index: 1000;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .favorites-panel.active {
            right: 0;
        }

        .favorites-panel-header {
            padding: 1.25rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .favorites-panel-header h3 {
            margin: 0;
            font-size: 1.125rem;
            color: var(--text);
        }

        .favorites-panel-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light);
            padding: 0.25rem;
            line-height: 1;
        }

        .favorites-panel-close:hover {
            color: var(--accent);
        }

        .favorites-panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .favorites-empty {
            text-align: center;
            color: var(--text-light);
            padding: 2rem;
        }

        .favorites-item {
            background: var(--bg);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 0.75rem;
        }

        .favorites-item:last-child {
            margin-bottom: 0;
        }

        .favorites-item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }

        .favorites-item-word {
            font-family: 'Playfair Display', serif;
            font-size: 1rem;
            font-weight: 600;
            color: var(--primary);
        }

        .favorites-item-sinhala {
            font-size: 0.875rem;
            color: var(--text-light);
            font-family: 'Noto Sans Sinhala', sans-serif;
            margin-bottom: 0.5rem;
        }

        .favorites-item-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .favorites-item-time {
            font-size: 0.75rem;
            color: var(--text-light);
        }

        .favorites-item-actions {
            display: flex;
            gap: 0.5rem;
        }

        .favorites-item-btn {
            background: none;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.25rem 0.5rem;
            cursor: pointer;
            font-size: 0.75rem;
            color: var(--text-light);
            transition: all 0.2s;
        }

        .favorites-item-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .favorites-item-btn.delete:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(233, 69, 96, 0.1);
        }

        .favorites-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            display: none;
        }

        .favorites-overlay.active {
            display: block;
        }

        .favorites-group {
            background: var(--bg);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            border: 1px solid var(--border);
        }

        .favorites-group-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }

        .favorites-group-main {
            flex: 1;
        }

        .favorites-group-title {
            font-family: 'Playfair Display', serif;
            font-size: 1rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 0.25rem;
        }

        .favorites-group-sinhala {
            font-size: 0.8rem;
            color: var(--text-light);
            font-family: 'Noto Sans Sinhala', sans-serif;
            line-height: 1.5;
        }

        .favorites-group-count {
            font-size: 0.7rem;
            padding: 0.15rem 0.5rem;
            background: var(--accent);
            border-radius: 10px;
            color: white;
        }

        .favorites-group-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 0.5rem;
            border-top: 1px solid var(--border);
        }

        .favorites-group-actions {
            display: flex;
            gap: 0.5rem;
        }

        .favorites-group-expand {
            background: none;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.35rem 0.75rem;
            cursor: pointer;
            font-size: 0.75rem;
            color: var(--text-light);
            margin-top: 0.5rem;
            width: 100%;
        }

        .favorites-group-expand:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .favorites-group-items {
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px dashed var(--border);
            display: none;
        }

        .favorites-group-item {
            padding: 0.75rem;
            background: rgba(0,0,0,0.03);
            border-radius: 8px;
            margin-bottom: 0.5rem;
        }

        .favorites-group-item:last-child {
            margin-bottom: 0;
        }

        /* Search Section */
        .search-section {
            max-width: 800px;
            margin: -2rem auto 2rem;
            padding: 0 1.5rem;
            position: relative;
            z-index: 10;
        }

        .search-box {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: var(--shadow-hover);
        }

        .search-input-wrapper {
            position: relative;
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .search-input {
            width: 100%;
            min-width: 200px;
            padding: 1rem 1.25rem;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
            background: var(--bg);
            box-sizing: border-box;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            background: white;
        }

        .search-btn {
            padding: 1rem 2rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .search-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }

        .search-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .search-btn .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* Match Settings */
        .match-settings {
            margin-top: 1rem;
            padding: 1rem;
            background: var(--bg);
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .match-settings-title {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .match-mode {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .match-mode label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            cursor: pointer;
        }

        .match-mode input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
        }

        .similarity-control {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .similarity-label {
            font-size: 0.875rem;
            color: var(--text-light);
            min-width: 80px;
        }

        .similarity-slider {
            flex: 1;
            min-width: 150px;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: var(--border);
            border-radius: 3px;
            outline: none;
        }

        .similarity-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
        }

        .similarity-slider::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            box-shadow: 0 2px 8px rgba(233,69,96,0.4);
        }

        .similarity-value {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--accent);
            min-width: 50px;
            text-align: right;
        }

        /* Filters */
        .filters {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-label {
            font-size: 0.875rem;
            color: var(--text-light);
            margin-right: 0.5rem;
        }

        .filter-select {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: white;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .clear-btn {
            padding: 0.5rem 1rem;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.875rem;
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.2s;
        }

        .clear-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Translation Info */
        .translation-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.75rem;
            padding: 0.5rem 0.75rem;
            background: linear-gradient(135deg, #e3f2fd 0%, #f3e5f5 100%);
            border-radius: 8px;
            font-size: 0.875rem;
            color: var(--text);
        }

        .translation-info .icon {
            font-size: 1rem;
        }

        .translation-info .text {
            flex: 1;
        }

        .translation-info .loading {
            width: 14px;
            height: 14px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* Results */
        .results-section {
            max-width: 800px;
            margin: 0 auto 3rem;
            padding: 0 1.5rem;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .results-count {
            font-size: 0.875rem;
            color: var(--text-light);
        }

        .results-count strong {
            color: var(--accent);
        }

        .results-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 0.75rem;
        }

        .result-item {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.25rem;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }

        .result-item:hover {
            transform: translateX(4px);
            box-shadow: var(--shadow-hover);
            border-left-color: var(--accent);
        }

        .result-item.exact-match {
            border-left-color: var(--gold);
            background: linear-gradient(135deg, #fffef0 0%, #ffffff 100%);
        }

        .result-group {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.25rem;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }

        .result-group:hover {
            box-shadow: var(--shadow-hover);
            border-left-color: var(--accent);
        }

        .result-group.expanded {
            border-left-color: var(--gold);
        }

        .result-group-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
            gap: 0.75rem;
        }

        .result-group-main {
            flex: 1;
        }

        .result-group-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .result-group-others {
            font-size: 0.9rem;
            color: var(--text-light);
            font-family: 'Noto Sans Sinhala', sans-serif;
            line-height: 1.6;
        }

        .result-group-count {
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            background: var(--bg);
            border-radius: 20px;
            color: var(--text-light);
        }

        .result-group-expand {
            background: none;
            border: 1px solid var(--border);
            cursor: pointer;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            color: var(--accent);
            transition: all 0.2s;
            margin-top: 0.75rem;
        }

        .result-group-expand:hover {
            background: var(--bg);
            border-color: var(--accent);
        }

        .result-group-items {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
            display: none;
        }

        .result-group.expanded .result-group-items {
            display: block;
        }

        .result-group-item {
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            background: var(--bg);
            border-radius: 8px;
        }

        .result-group-item:last-child {
            margin-bottom: 0;
        }

        .result-group-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
            gap: 0.75rem;
        }

        .result-word {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--primary);
        }

        .result-prefix {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
            color: white;
            font-size: 0.75rem;
            font-weight: 500;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .result-translation {
            font-family: 'Noto Sans Sinhala', sans-serif;
            font-size: 1.1rem;
            color: var(--text);
            line-height: 1.8;
            margin-bottom: 0.5rem;
        }

        .result-similarity {
            font-size: 0.75rem;
            color: var(--text-light);
            margin-bottom: 0.5rem;
        }

        .result-similarity .score {
            display: inline-block;
            padding: 0.125rem 0.5rem;
            background: var(--bg);
            border-radius: 4px;
            font-weight: 500;
        }

        .result-similarity .score.high {
            background: #d4edda;
            color: #155724;
        }

        .result-similarity .score.medium {
            background: #fff3cd;
            color: #856404;
        }

        .result-similarity .score.low {
            background: #f8d7da;
            color: #721c24;
        }

        .chinese-translation {
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px dashed var(--border);
        }

        .chinese-translation-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.375rem 0.75rem;
            background: white;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.8rem;
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.2s;
        }

        .chinese-translation-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .chinese-translation-btn .loading {
            width: 12px;
            height: 12px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .chinese-translation-text {
            margin-top: 0.5rem;
            padding: 0.5rem 0.75rem;
            background: linear-gradient(135deg, #e8f5e9 0%, #f1f8e9 100%);
            border-radius: 6px;
            font-size: 0.9rem;
            color: var(--text);
            border-left: 3px solid #4caf50;
        }

        /* Loading & Empty States */
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-light);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-light);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Prefix Legend */
        .legend {
            max-width: 800px;
            margin: 0 auto 2rem;
            padding: 0 1.5rem;
        }

        .legend-title {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-light);
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .legend-items {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .legend-item {
            padding: 0.375rem 0.75rem;
            background: white;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.75rem;
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.2s;
        }

        .legend-item:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .legend-item.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

    <script>
        // 合并四个数据文件
        const DICTIONARY_DATA = [
            ...DICTIONARY_DATA_1,
            ...DICTIONARY_DATA_2,
            ...DICTIONARY_DATA_3,
            ...DICTIONARY_DATA_4
        ];
        // 注意：外部文件中声明的const变量无法重新赋值，无需手动释放
    </script>

    <script>
        // ============================================
        // 应用逻辑
        // ============================================
        
        // 收藏本功能 - 支持两个收藏本
        let currentFavoritesBook = 'en-si'; // 当前打开的收藏本
        
        function toggleFavoritesPanel(bookType = currentFavoritesBook) {
            const panel = document.getElementById('favoritesPanel');
            const overlay = document.getElementById('favoritesOverlay');
            const title = document.getElementById('favoritesTitle');
            
            // 更新当前收藏本类型
            currentFavoritesBook = bookType;
            
            // 更新按钮状态
            document.getElementById('favoritesBtnEnSi').classList.toggle('active', bookType === 'en-si');
            document.getElementById('favoritesBtnSiEn').classList.toggle('active', bookType === 'si-en');
            
            // 更新标题
            title.textContent = bookType === 'en-si' ? '🇬🇧 英翻僧收藏本' : '🇱🇰 僧翻英收藏本';
            
            panel.classList.toggle('active');
            overlay.classList.toggle('active');
            
            if (panel.classList.contains('active')) {
                renderFavoritesPanel(bookType);
            }
        }

        function updateFavoritesCount() {
            // 更新英翻僧收藏本计数
            const favoritesEnSi = getFavorites('en-si');
            const countEnSi = document.getElementById('favoritesCountEnSi');
            if (countEnSi) {
                const groupedEnSi = groupFavoritesByStem(favoritesEnSi, false);
                countEnSi.textContent = groupedEnSi.size;
            }
            
            // 更新僧翻英收藏本计数
            const favoritesSiEn = getFavorites('si-en');
            const countSiEn = document.getElementById('favoritesCountSiEn');
            if (countSiEn) {
                const groupedSiEn = groupFavoritesByStem(favoritesSiEn, true);
                countSiEn.textContent = groupedSiEn.size;
            }
        }

        function renderFavoritesPanel(bookType = 'en-si') {
            const content = document.getElementById('favoritesPanelContent');
            const favorites = getFavorites(bookType);
            const isSiEn = bookType === 'si-en';
            
            if (favorites.length === 0) {
                content.innerHTML = '<div class="favorites-empty">暂无收藏</div>';
                return;
            }
            
            // 按词干分组
            const grouped = groupFavoritesByStem(favorites, isSiEn);
            
            // 按时间排序（最新的在前）
            const sortedGroups = Array.from(grouped.values()).sort((a, b) => {
                const aLatest = Math.max(...a.items.map(item => item.timestamp || 0));
                const bLatest = Math.max(...b.items.map(item => item.timestamp || 0));
                return bLatest - aLatest;
            });
            
            content.innerHTML = sortedGroups.map((group, groupIndex) => {
                const { stem, items } = group;
                const count = items.length;
                const latestTime = Math.max(...items.map(item => item.timestamp || 0));
                const timeStr = latestTime ? formatTime(latestTime) : '';
                
                // 构建显示内容
                let displayTexts = [];
                if (isSiEn) {
                    // 僧翻英收藏本：显示英文+词性
                    displayTexts = items.map(item => `${item.english} (${item.prefix})`);
                } else {
                    // 英翻僧收藏本：显示僧伽罗语+词性
                    displayTexts = items.map(item => `${item.sinhala} (${item.prefix})`);
                }
                
                return `
                    <div class="favorites-group">
                        <div class="favorites-group-header">
                            <div class="favorites-group-main">
                                <div class="favorites-group-title">${escapeHtml(stem)}</div>
                                <div class="favorites-group-sinhala">${escapeHtml(displayTexts.join('; '))}</div>
                            </div>
                        </div>
                        <div class="favorites-group-footer">
                            <span class="favorites-item-time">${timeStr}</span>
                            <div class="favorites-group-actions">
                                <button class="favorites-item-btn" onclick="viewFavoriteGroup(${groupIndex}, '${bookType}')">查看</button>
                                <button class="favorites-item-btn delete" onclick="removeFavoriteGroup(${groupIndex}, '${bookType}')">删除全部</button>
                            </div>
                        </div>
                        <button class="favorites-group-expand" onclick="toggleFavoritesGroupExpand(${groupIndex})">
                            展开查看详情
                        </button>
                        <div class="favorites-group-items" id="fav-group-${groupIndex}">
                            ${items.map((item, itemIndex) => {
                                const itemTime = item.timestamp ? formatTime(item.timestamp) : '';
                                return `
                                    <div class="favorites-group-item">
                                        <div class="favorites-item-header">
                                            <span class="favorites-item-word">${escapeHtml(item.english)}</span>
                                            <span class="result-prefix">${item.prefix}</span>
                                        </div>
                                        <div class="favorites-item-sinhala">${escapeHtml(item.sinhala)}</div>
                                        <div class="favorites-item-footer">
                                            <span class="favorites-item-time">${itemTime}</span>
                                            <div class="favorites-item-actions">
                                                <button class="favorites-item-btn" onclick="viewFavoriteItem(${groupIndex}, ${itemIndex}, '${bookType}')">查看</button>
                                                <button class="favorites-item-btn delete" onclick="removeFavoriteItem(${groupIndex}, ${itemIndex}, '${bookType}')">删除</button>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 按词干分组收藏
        function groupFavoritesByStem(favorites, isSiEn = false) {
            const grouped = new Map();
            
            favorites.forEach(fav => {
                // 根据收藏本类型决定分组键
                let stem;
                if (isSiEn) {
                    // 僧翻英收藏本：按僧伽罗语分组
                    stem = fav.sinhala.toLowerCase();
                } else {
                    // 英翻僧收藏本：按英文词干分组
                    stem = extractWordStem(fav.english).toLowerCase();
                }
                
                if (!grouped.has(stem)) {
                    grouped.set(stem, {
                        stem,
                        items: []
                    });
                }
                grouped.get(stem).items.push(fav);
            });
            
            return grouped;
        }

        function viewFavorite(index, bookType = 'en-si') {
            const favorites = getFavorites(bookType);
            const sortedFavorites = [...favorites].sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            const fav = sortedFavorites[index];
            
            if (fav) {
                // 设置搜索词并执行搜索
                document.getElementById('searchInput').value = bookType === 'si-en' ? fav.sinhala : fav.english;
                toggleFavoritesPanel();
                performSearch(true, fav.sinhala, fav.prefix);
            }
        }

        function removeFavorite(index, bookType = 'en-si') {
            const favorites = getFavorites(bookType);
            const sortedFavorites = [...favorites].sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            const fav = sortedFavorites[index];
            
            if (fav) {
                const removeIndex = favorites.findIndex(f => 
                    f.english === fav.english && f.sinhala === fav.sinhala && f.prefix === fav.prefix
                );
                
                if (removeIndex >= 0) {
                    favorites.splice(removeIndex, 1);
                    saveFavorites(favorites, bookType);
                    updateFavoritesCount();
                    renderFavoritesPanel(bookType);
                }
            }
        }

        // 查看收藏分组
        function viewFavoriteGroup(groupIndex, bookType = 'en-si') {
            const favorites = getFavorites(bookType);
            const grouped = groupFavoritesByStem(favorites, bookType === 'si-en');
            const sortedGroups = Array.from(grouped.values()).sort((a, b) => {
                const aLatest = Math.max(...a.items.map(item => item.timestamp || 0));
                const bLatest = Math.max(...b.items.map(item => item.timestamp || 0));
                return bLatest - aLatest;
            });
            
            const group = sortedGroups[groupIndex];
            if (group && group.items.length > 0) {
                const firstItem = group.items[0];
                // 根据收藏本类型决定搜索词
                const searchWord = bookType === 'si-en' ? group.stem : group.stem;
                document.getElementById('searchInput').value = searchWord;
                toggleFavoritesPanel();
                performSearch(true, firstItem.sinhala, firstItem.prefix);
            }
        }

        // 删除整个收藏分组
        function removeFavoriteGroup(groupIndex, bookType = 'en-si') {
            const favorites = getFavorites(bookType);
            const grouped = groupFavoritesByStem(favorites, bookType === 'si-en');
            const sortedGroups = Array.from(grouped.values()).sort((a, b) => {
                const aLatest = Math.max(...a.items.map(item => item.timestamp || 0));
                const bLatest = Math.max(...b.items.map(item => item.timestamp || 0));
                return bLatest - aLatest;
            });
            
            const group = sortedGroups[groupIndex];
            if (group) {
                // 删除该分组的所有词条
                group.items.forEach(item => {
                    const idx = favorites.findIndex(f => 
                        f.english === item.english && f.sinhala === item.sinhala && f.prefix === item.prefix
                    );
                    if (idx >= 0) {
                        favorites.splice(idx, 1);
                    }
                });
                
                saveFavorites(favorites, bookType);
                updateFavoritesCount();

        // 英文搜索函数（精确匹配）
        function searchEnglish(query, mode = 'exact') {
            const searchQuery = query.toLowerCase();
            const results = [];
            
            DICTIONARY_DATA.forEach(item => {
                const english = (item.english || item.en || '').toLowerCase();
                let match = false;
                
                switch (mode) {
                    case 'exact':
                        match = english === searchQuery;
                        break;
                    case 'startsWith':
                        match = english.startsWith(searchQuery);
                        break;
                    case 'contains':
                        match = english.includes(searchQuery);
                        break;
                }
                
                if (match) {
                    results.push({
                        item,
                        score: 100,
                        isExact: english === searchQuery,
                        english: item.english || item.en || '',
                        sinhala: item.sinhala || item.si || '',
                        prefix: item.prefix || item.type || ''
                    });
                }
            });
            
            return results;
        }

        // 僧伽罗语智能搜索函数
        function searchBySinhalaSmart(query) {
            const results = [];
            
            DICTIONARY_DATA.forEach(item => {
                const sinhala = item.sinhala || item.si || '';
                const siMatch = sinhalaMatchScore(query, sinhala);
                
                if (siMatch) {
                    results.push({
                        item,
                        score: siMatch.score,
                        isExact: siMatch.score === 100,
                        english: item.english || item.en || '',
                        sinhala: sinhala,
                        prefix: item.prefix || item.type || ''
                    });
                }
            });
            
            return results.sort((a, b) => b.score - a.score);
        }

        // 获取推荐词条
        function getSuggestions(query) {
            const matchMode = document.querySelector('input[name="matchMode"]:checked').value;
            const prefixFilter = document.getElementById('prefixFilter').value;
            const similarityThreshold = parseInt(document.getElementById('similaritySlider').value);
            const searchQuery = query.toLowerCase();
            const isChineseQuery = isChinese(query);
            const isSinhalaQuery = isSinhala(query);

            const scoredResults = [];

            DICTIONARY_DATA.forEach(item => {
                const english = (item.english || item.en || '').toLowerCase();
                const sinhala = item.sinhala || item.si || '';
                const prefix = item.prefix || item.type || '';
                
                if (prefixFilter && prefix !== prefixFilter) return;

                let score = 0;

                if (isSinhalaQuery) {
                    const siMatch = sinhalaMatchScore(query, sinhala);
                    if (siMatch) score = siMatch.score;
                } else if (!isChineseQuery) {
                    switch (matchMode) {
                        case 'exact':
                            if (english === searchQuery) score = 100;
                            break;
                        case 'startsWith':
                            if (english.startsWith(searchQuery)) score = 90;
                            break;
                        case 'contains':
                            if (english.includes(searchQuery)) score = 80;
                            break;
                        case 'fuzzy':
                            const similarity = calculateSimilarity(english, searchQuery);
                            if (similarity >= similarityThreshold) score = similarity;
                            break;
                    }
                }

                if (score > 0) {
                    scoredResults.push({
                        item,
                        score,
                        english: item.english || item.en || '',
                        sinhala: item.sinhala || item.si || '',
                        prefix: item.prefix || item.type || ''
                    });
                }
            });

            scoredResults.sort((a, b) => b.score - a.score);
            
            // 按组返回结果
            return groupSuggestionsByStem(scoredResults, isSinhalaQuery);
        }

        // 按词干分组推荐词条
        function groupSuggestionsByStem(results, isSinhalaQuery) {
            const grouped = new Map();
            
            results.forEach(result => {
                let groupKey;
                if (isSinhalaQuery) {
                    groupKey = result.sinhala.toLowerCase();
                } else {
                    groupKey = extractWordStem(result.english).toLowerCase();
                }
                
                if (!grouped.has(groupKey)) {
                    grouped.set(groupKey, {
                        mainWord: isSinhalaQuery ? result.sinhala : result.english,
                        isSinhalaQuery,
                        items: [],
                        bestScore: result.score
                    });
                }
                
                const group = grouped.get(groupKey);
                group.items.push(result);
                if (result.score > group.bestScore) {
                    group.bestScore = result.score;
                }
            });
            
            return Array.from(grouped.values()).sort((a, b) => b.bestScore - a.bestScore).slice(0, 10);
        }

            }).join('');
        }

        // ========== 清洗翻译结果，只保留词语形式 ==========
        function cleanToWordForm(text, targetLang) {
            if (!text) return '';

            let cleaned = text.trim();

            // 1. 去除所有标点符号（保留字母、数字、僧伽罗语字符、汉字、空格、连字符）
            cleaned = cleaned.replace(/[.,!?;:、。，！？；：""''《》【】()\[\]{}<>…—～·]/g, '');

            // 2. 如果目标是英文，去除末尾多余的标点
            if (targetLang === 'en') {
                cleaned = cleaned.replace(/[.!?]+$/, '');
            }

            // 3. 如果目标是中文，去除多余的句号、逗号等
            if (targetLang === 'zh') {
                cleaned = cleaned.replace(/[。，！？、；：]$/, '');
            }

            // 4. 处理 API 可能返回 "eat." 这种带句点的形式
            cleaned = cleaned.replace(/\.$/, '');

            // 5. 处理 "to eat" 这种不定式形式 → 去除 "to "
            if (targetLang === 'en' && cleaned.toLowerCase().startsWith('to ')) {
                cleaned = cleaned.substring(3);
            }

            // 6. 去除首尾空格，并将多个空格合并为一个
            cleaned = cleaned.trim().replace(/\s+/g, ' ');

            // 7. 如果清理后为空，返回原始文本的清洗版本
            if (cleaned === '') {
                cleaned = text.replace(/[^\w\u0D80-\u0DFF\u4e00-\u9fa5]/g, '').trim();
            }

            return cleaned;
        }

        // 调用 MyMemory API 翻译
        async function translateWithMyMemory(text, fromLang, toLang) {
            const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${fromLang}|${toLang}`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.responseStatus === 200) {
                    // 清洗翻译结果为词语形式
                    const targetLang = toLang === 'zh-CN' ? 'zh' : 'en';
                    const cleanedTranslation = cleanToWordForm(data.responseData.translatedText, targetLang);

                    return {
                        success: true,
                        translation: cleanedTranslation,
                        original: data.responseData.translatedText,
                        match: data.responseData.match
                    };
                } else {
                    return { success: false, error: data.responseDetails };
                }
            } catch (error) {
                return { success: false, error: error.message };
            }
        }
